<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Plateforme de digitalisation{% endblock %}</title>
  <!-- Tailwind via CDN : uniquement pour le scaffolding. À remplacer par un build Tailwind
       compilé avant la mise en production (CDN non recommandé en prod par Tailwind lui-même). -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  {% block content %}{% endblock %}
</body>
</html>

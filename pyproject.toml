[project]
name = "digitalisation-platform"
version = "0.1.0"
description = "Plateforme de digitalisation pilotée par agents IA pour PME/indépendants en Afrique"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platform_core*", "app*"]

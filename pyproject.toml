[project]
name = "digitalisation-platform"
version = "0.1.0"
description = "Plateforme de digitalisation pilotée par agents IA pour PME/indépendants en Afrique"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "boto3>=1.34",
    "httpx>=0.27",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Outil CLI invoqué en sous-processus par agents/maintenance/security_scan.py (jamais
    # importé en Python) — à inclure aussi dans l'environnement de production une fois la
    # tâche planifiée de scan réel construite (pas encore le cas, voir skills/README.md).
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# "agents*" ajouté ici : sans lui, le package n'est pas enregistré par `pip install .`
# (fonctionnait quand même en dev/test uniquement parce que le répertoire courant se
# retrouve sur sys.path dans ce cas précis — fragile, corrigé pour que ce soit vrai aussi
# dans l'image Docker buildée avec `pip install .`, voir Dockerfile).
include = ["platform_core*", "app*", "agents*"]

[tool.setuptools.package-data]
# setuptools n'inclut par défaut que les fichiers .py d'un package : sans cette section, les
# templates Jinja2 (fichiers non-Python) sont silencieusement absents de `pip install .` —
# bug confirmé en testant une installation non-éditable depuis un répertoire externe.
"agents.creation_site" = ["templates/*.jinja", "templates/sectors/*.jinja"]
# ".gitkeep" listé explicitement : un glob "*" ne capture pas les fichiers commençant par un
# point, et app.main monte StaticFiles(directory=...) qui plante au démarrage si le dossier
# "static" n'existe pas du tout (aujourd'hui vide à part ce fichier placeholder).
"app" = ["templates/*.html", "static/*", "static/.gitkeep"]
